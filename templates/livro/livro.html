<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Gerenciamento de Livros</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../css/estetica.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="{% url 'home' %}">Biblioteca</a>
    </div>
  </nav>

  <div class="container py-5">
    <h2>Gerenciamento de Livros</h2>
    
    <div class="mb-4">
      <a href="{% url 'cadastrar_livro' %}" class="btn btn-success">Cadastrar Novo Livro</a>
      <a href="{% url 'consultar_livro' %}" class="btn btn-info">Consultar Livros</a>
    </div>

    <table class="table">
      <thead>
        <tr>
          <th>Título</th>
          <th>Autor</th>
          <th>Gênero</th>
          <th>ISBN</th>
          <th>Cópias</th>
          <th>Ano</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        {% for livro in livros %}
        <tr>
          <td>{{ livro.titulo }}</td>
          <td>{{ livro.autor }}</td>
          <td>{{ livro.genero }}</td>
          <td>{{ livro.isbn }}</td>
          <td>{{ livro.copias }}</td>
          <td>{{ livro.ano }}</td>
          <td>
            <a href="{% url 'editar_livro' livro.id %}" class="btn btn-warning btn-sm">Editar</a>
            <a href="{% url 'excluir_livro' livro.id %}" class="btn btn-danger btn-sm">Excluir</a>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
