<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Excluir Livro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/estetica.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">Biblioteca</a>
        </div>
    </nav>

    <div class="container py-5">
        <h2>Excluir Livro</h2>
        <div class="alert alert-danger">
            <p>Tem certeza que deseja excluir o livro "{{ livro.titulo }}"?</p>
            <p>Esta ação não pode ser desfeita.</p>
        </div>
        <form method="POST" action="{% url 'excluir_livro' livro.id %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Confirmar Exclusão</button>
            <a href="{% url 'livro' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>
</html>
