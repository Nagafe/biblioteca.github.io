<!-- livros/cadastro.html (Cadastro de Livro) -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Livro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../css/estetica.css">

</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="{% url 'home' %}">Biblioteca</a>
    </div>
  </nav>

  <div class="container py-5">

       <div class="menu-links">
      <a class="btn btn-link" href="../livro.html"></a>

    </div>

    <h2>Cadastro de Livro</h2>
    <form method="POST" action="{% url 'cadastrar_livro' %}">
      {% csrf_token %}
      <div class="mb-3">
        <label for="titulo" class="form-label">Título:</label>
        <input type="text" class="form-control" id="titulo" name="titulo" required>
      </div>
      <div class="mb-3">
        <label for="autor" class="form-label">Autor:</label>
        <input type="text" class="form-control" id="autor" name="autor" required>
      </div>
      <div class="mb-3">
        <label for="genero" class="form-label">Gênero:</label>
        <input type="text" class="form-control" id="genero" name="genero" required>
      </div>
      <div class="mb-3">
        <label for="isbn" class="form-label">ISBN:</label>
        <input type="text" class="form-control" id="isbn" name="isbn" pattern="[0-9]{13}" maxlength="13" placeholder="XXXXXXXXXXXXX" required>
        <div class="form-text">Digite o ISBN com 13 dígitos numéricos</div>
      </div>
      <div class="mb-3">
        <label for="copias" class="form-label">Número de cópias:</label>
        <input type="number" class="form-control" id="copias" name="copias" required>
      </div>
      <div class="mb-3">
        <label for="ano" class="form-label">Ano:</label>
        <input type="number" class="form-control" id="ano" name="ano" required>
      </div>
      <button type="submit" class="btn btn-success">Cadastrar Livro</button>
      <a href="{% url 'livro' %}" class="btn btn-secondary">Cancelar</a>
    </form>
  </div>
</body>
</html>
