{% extends 'base.html' %}
{% load static %}

{% block navbar_actions %}
<ul class="navbar-nav">
    <li class="nav-item">
        <a class="btn btn-link nav-link" href="{% url 'livro_index' %}">Voltar ao Menu</a>
    </li>
    <li class="nav-item">
        <a class="btn btn-link nav-link" href="{% url 'livro_consultar' %}">Ver Lista</a>
    </li>
</ul>
{% endblock %}

{% block content %}
<div class="container py-5">
    <h2>Cadastrar Novo Livro</h2>
    <form method="POST" action="{% url 'cadastrar_livro' %}">
        {% csrf_token %}
        <div class="form-group">
            {{ form.as_p }} {# Mantendo as_p para simplicidade #}
        </div>
        <button type="submit" class="btn btn-primary">Cadastrar Livro</button>
    </form>
</div>
{% endblock %}
