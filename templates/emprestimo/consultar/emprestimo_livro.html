<!-- livros/cadastro.html (Cadastro de Livro) -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Empréstimo de Livro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../css/estetica.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="../../home.html">Biblioteca</a>
    </div>
  </nav>

  <div class="container py-5">
    <div class="menu-links">
      <a class="btn btn-link" href="../consulta.html">Voltar para Consulta</a>
    </div>

    <h2>Empréstimo de Livro</h2>
    <form action="#" method="POST">
      {% csrf_token %}
      <div class="mb-3">
        <label for="nomeLeitor" class="form-label">Nome do Leitor:</label>
        <input type="text" class="form-control" id="nomeLeitor" name="leitor" placeholder="Nome do leitor">
      </div>
      <div class="mb-3">
        <label for="numero_dias" class="form-label">Número de Dias:</label>
        <input type="number" class="form-control" id="numero_dias" name="numero_dias" min="1" max="30" value="7" placeholder="Número de dias para devolução">
      </div>
      <div class="mb-3">
        <label for="nome_livro" class="form-label">Livro:</label>
        <input type="text" class="form-control" id="nome_livro" name="nomeLivro" placeholder="Nome do Livro">
      </div>
      <div class="mb-3">
        <label for="genero" class="form-label">Gênero:</label>
        <input type="text" class="form-control" id="genero" name="genero" placeholder="Insira o gênero">
      </div>
      <div class="mb-3">
        <label for="data_entrega" class="form-label">Data de Entrega:</label>
        <input type="date" class="form-control" id="data_entrega" name="data_entrega">
      </div>

      <table class="table table-bordered table-striped">
        <thead class="table-secondary">
          <tr>
            <th>Nome do Leitor</th>
            <th>Livro</th>
            <th>Gênero</th>
            <th>Dias</th>
            <th>Data Entrega</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
          </tr>
        </tbody>
      </table>

      <button type="submit" name="action" value="adicionar" class="btn btn-success">Adicionar</button>
      <button type="submit" name="action" value="finalizar" class="btn btn-primary">Finalizar</button>
    </form>
  </div>
</body>
</html>
