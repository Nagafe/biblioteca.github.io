{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h3 class="card-title mb-0">Excluir Leitor</h3>
                    <a href="{% url 'home' %}" class="btn btn-outline-primary">
                        <i class="bi bi-house"></i> Dashboard
                    </a>
                </div>
                <div class="card-body">
                    <p class="mb-4">Tem certeza que deseja excluir o leitor <strong>{{ leitor.nome }}</strong>?</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'leitor' %}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-danger">Confirmar Exclusão</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
