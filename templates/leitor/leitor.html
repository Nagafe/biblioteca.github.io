{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Leitores</h2>
        <div>
            <a href="{% url 'consultar_leitor' %}" class="btn btn-info me-2">
                <i class="bi bi-search"></i> Consultar
            </a>
            <a href="{% url 'cadastrar_leitor' %}" class="btn btn-success">
                <i class="bi bi-person-plus"></i> Novo Leitor
            </a>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Telefone</th>
                    <th>Email</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                {% for leitor in leitores %}
                <tr>
                    <td>{{ leitor.nome }}</td>
                    <td>{{ leitor.telefone }}</td>
                    <td>{{ leitor.email }}</td>
                    <td>
                        <a href="{% url 'editar_leitor' leitor.id %}" class="btn btn-warning btn-sm">
                            <i class="bi bi-pencil fs-4"></i>
                        </a>
                        <a href="{% url 'excluir_leitor' leitor.id %}" class="btn btn-danger btn-sm">
                            <i class="bi bi-trash3 fs-4"></i>
                        </a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" class="text-center">Nenhum leitor cadastrado.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
