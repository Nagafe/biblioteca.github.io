{% extends 'base.html' %}
{% load static %}

{% block navbar_actions %}
<ul class="navbar-nav">
    <li class="nav-item">
        <a class="btn btn-link nav-link" href="{% url 'funcionario_index' %}">Voltar ao Menu</a>
    </li>
    <li class="nav-item">
        <a class="btn btn-link nav-link" href="{% url 'funcionario_consultar' %}">Ver Lista</a>
    </li>
</ul>
{% endblock %}

{% block content %}
<div class="container py-5">
    <h2>Cadastrar Novo Funcionário</h2>
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            {{ form.as_p }}
        </div>
        <button type="submit" class="btn btn-primary">Cadastrar Funcionário</button>
    </form>
</div>
{% endblock %}
