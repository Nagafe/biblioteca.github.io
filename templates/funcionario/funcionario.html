{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Funcionários</h2>
        <div>
            <a href="{% url 'consultar_funcionario' %}" class="btn btn-info me-2">
                <i class="bi bi-search fs-5"></i> Consultar
            </a>
            <a href="{% url 'cadastrar_funcionario' %}" class="btn btn-success">
                <i class="bi bi-plus-lg fs-5"></i> Novo Funcionário
            </a>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Telefone</th>
                    <th>Email</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                {% for funcionario in funcionarios %}
                <tr>
                    <td>{{ funcionario.nome }}</td>
                    <td>{{ funcionario.telefone }}</td>
                    <td>{{ funcionario.email }}</td>
                    <td>
                        <a href="{% url 'editar_funcionario' funcionario.id %}" class="btn btn-warning btn-sm">
                            <i class="bi bi-pencil fs-4"></i>
                        </a>
                        <a href="{% url 'excluir_funcionario' funcionario.id %}" class="btn btn-danger btn-sm">
                            <i class="bi bi-trash3 fs-4"></i>
                        </a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" class="text-center">Nenhum funcionário cadastrado.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
